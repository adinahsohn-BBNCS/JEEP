<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Private photo approval — Amp'd Rubicon</title>
  <style>
    :root {
      --bg: #0c0b09;
      --paper: #f6f3ed;
      --ampd: #c9a227;
      --muted: rgba(246, 243, 237, 0.65);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--paper);
      line-height: 1.45;
    }
    header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(246, 243, 237, 0.12);
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.5rem;
      color: var(--ampd);
    }
    p { margin: 0.35rem 0; color: var(--muted); max-width: 42rem; }
    code { color: var(--ampd); }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1.5rem;
    }
    figure {
      margin: 0;
      background: #16140f;
      border: 1px solid rgba(246, 243, 237, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
    }
    figcaption {
      padding: 0.85rem 1rem 1rem;
    }
    figcaption strong {
      display: block;
      color: var(--ampd);
      margin-bottom: 0.25rem;
    }
    .tag {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(246, 243, 237, 0.45);
    }
  </style>
</head>
<body>
  <header>
    <h1>Private approval — not linked from the main site</h1>
    <p>
      These are candidates I pulled from the Lightroom share that fill gaps on the live page
      (especially side profiles and cabin electronics). Pick the ones you want and tell me which to add.
    </p>
    <p>Main site stays unchanged until you approve.</p>
  </header>

  <div class="grid">
    <figure>
      <img src="pics/approve/DSC02048.jpg" alt="Full side profile with rock lights on" />
      <figcaption>
        <strong>DSC02048 — Full side profile</strong>
        Rock lights on. Best gap-filler — you don’t have a clean side shot on the site yet.
        <span class="tag">Recommended</span>
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02050.jpg" alt="Full side profile alternate" />
      <figcaption>
        <strong>DSC02050 — Full side profile (alternate)</strong>
        Same idea, slightly different framing. Pick one of the two sides if you don’t want both.
        <span class="tag">Recommended</span>
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02049.jpg" alt="Three-quarter with headlights and rock lights" />
      <figcaption>
        <strong>DSC02049 — Three-quarter, lights blazing</strong>
        Headlights + rock lights. Strong “night crawler” energy beyond the studio stills.
        <span class="tag">Recommended</span>
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02057.jpg" alt="Three-quarter clean night stance" />
      <figcaption>
        <strong>DSC02057 — Three-quarter, clean stance</strong>
        Lights off, full build visible. Good if you want another exterior without glow.
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02051.jpg" alt="Three-quarter alternate angle" />
      <figcaption>
        <strong>DSC02051 — Three-quarter alternate</strong>
        Similar to shots you already have — optional, not a must.
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02046.jpg" alt="Cabin Alpine screen radio and twin stick" />
      <figcaption>
        <strong>DSC02046 — Cabin electronics</strong>
        Alpine + upper screen + radio + twin-stick. Shows the cockpit better than the current cabin shot.
        <span class="tag">Recommended</span>
      </figcaption>
    </figure>

    <figure>
      <img src="pics/approve/DSC02047.jpg" alt="Cabin close-up screens and shifters" />
      <figcaption>
        <strong>DSC02047 — Cabin close-up</strong>
        Tighter version of the same setup. Use if you prefer this crop over 046.
      </figcaption>
    </figure>
  </div>
</body>
</html>
